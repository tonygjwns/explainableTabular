# Phase 0: TabM baseline reproduction config
# See EXPERIMENT_PLAN.md §7 (evaluation) and PLAN.md §4 Phase 0.
# Goal: reproduce TabM on TabReD (Cai temporal split) within +/-1% of paper.

experiment:
  name: phase0_tabm_baseline
  phase: 0
  seeds: [0, 1, 2, 3, 4]          # Phase 0: 5-10 seeds (EXPERIMENT_PLAN §7.1)
  split: default                   # Phase 0: TabReD official temporal split (matches
                                   # published TabM numbers). Cai resplit is Phase 1+
                                   # (src/data/splits.py:cai_resplit).
  results_dir: results/phase0/tabm_baseline

data:
  # TabReD preprocessing output dir (SETUP.md §3). ADJUST to your server layout, e.g.
  # absolute ~/external/tabred/data, or symlink it into the repo: ln -s ~/external/tabred/data data
  root: data
  datasets:                        # all 8 TabReD; run_phase0 skips any whose data is absent
    - sberbank_housing
    - cooking_time                 # Yandex datasets (no competition rules needed) first
    - delivery_eta
    - maps_routing
    - weather
    - homesite_insurance           # these 3 need Kaggle competition rules accepted
    - ecom_offers
    - homecredit_default

model:
  name: tabm
  k: 32                            # implicit submodels (TabM default)
  # remaining hyperparameters: start from TabM paper's recommended values,
  # NOT full Optuna tuning in Phase 0 (SETUP.md §8 pitfall 7).
  d_block: 512
  n_blocks: 3
  dropout: 0.1

training:
  optimizer: adamw                 # Muon is an orthogonal future option (Benchmarking Optimizers)
  learning_rate: 2.0e-3            # TabM-range default; tune in Phase 2, not Phase 0
  weight_decay: 0.0
  batch_size: 256
  patience: 16
  max_epochs: 200

reproduction_check:
  tolerance: 0.01                  # +/-1% vs TabM paper / TabReD table to pass Phase 0
